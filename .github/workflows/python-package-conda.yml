name: Python Package using Conda

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Conda dependency and source checks
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        # Login shells activate the environment created by setup-miniconda.
        shell: bash -el {0}
    env:
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Conda environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: tuatara-ci
          auto-activate: false
          python-version: "3.10"
          environment-file: environment.yml
          channels: conda-forge,bioconda
          channel-priority: strict
          conda-remove-defaults: "true"

      - name: Install compatibility constraints and CI dependencies
        run: |
          # Preserve environment.yml. These upper bounds retain APIs used by
          # the existing code: np.NaN, Series.iteritems and sns.distplot.
          # Seaborn is imported unconditionally by tools/tuakit.py.
          conda install --yes --override-channels -c conda-forge -c bioconda \
            "python=3.10" "numpy>=1.19.5,<2" "pandas>=1.2.5,<2" \
            "matplotlib>=3.3.4,<3.8" "networkx>=2.5,<3" \
            "flashtext>=2.7" "seaborn>=0.11,<0.14" "pyyaml>=5.4.1,<7" \
            scipy tk pip flake8 pytest
          python --version
          conda list
          python -m pip check

      - name: Verify Conda dependencies
        run: |
          python - <<'PY'
          import importlib
          import os
          import sys
          from pathlib import Path

          assert Path(sys.prefix).resolve() == Path(os.environ["CONDA_PREFIX"]).resolve()
          for name in (
              "numpy", "pandas", "matplotlib.pyplot", "networkx", "flashtext",
              "seaborn", "scipy", "yaml", "tkinter", "idlelib.pyshell",
          ):
              importlib.import_module(name)
              print(f"Import OK: {name}")
          PY

      - name: Check all Python source syntax
        run: |
          python - <<'PY'
          import ast
          import subprocess
          from pathlib import Path

          paths = subprocess.check_output(["git", "ls-files", "-z", "*.py"]).decode().split("\0")
          for filename in filter(None, paths):
              source = Path(filename).read_text(encoding="utf-8")
              ast.parse(source, filename=filename)
              print(f"Syntax OK: {filename}")
          PY
          python -m flake8 . --count --select=E9,F63,F7 --show-source --statistics

      - name: Report existing lint findings
        # Includes the pre-existing F821 in Model.reac_to_mets. Keep findings
        # visible without requiring changes to original Python code.
        run: python -m flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run tests when present
        run: |
          # No tests are currently checked in. Prevent pytest from importing
          # the root __init__.py just to discover that there are no tests.
          # Read the whole file list and finish naturally: explicit exit in a
          # login shell can fail while running the runner's logout hooks.
          if git ls-files -- '*.py' | grep -E '(^|/)(test_[^/]*|[^/]*_test)\.py

      - name: Document integration coverage
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ### Coverage limitations
          - This workflow checks Conda dependencies and source syntax, and reports lint findings.
          - Full `import tuatara` and model execution require a separate ScrumPy 3 installation, compiled for the same Python interpreter.
          - ScrumPy is absent from environment.yml; it is not installed or mocked by this workflow.
          - Model, BioCyc, Roary and Prokka integration fixtures are not included in this repository.
          - Package build/publish is outside this workflow: no setup.py or pyproject.toml is present.
          SUMMARY
 > /dev/null; then
            python -m pytest
          else
            echo "No test files are present; runtime tests were not run." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Document integration coverage
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ### Coverage limitations
          - This workflow checks Conda dependencies and source syntax, and reports lint findings.
          - Full `import tuatara` and model execution require a separate ScrumPy 3 installation, compiled for the same Python interpreter.
          - ScrumPy is absent from environment.yml; it is not installed or mocked by this workflow.
          - Model, BioCyc, Roary and Prokka integration fixtures are not included in this repository.
          - Package build/publish is outside this workflow: no setup.py or pyproject.toml is present.
          SUMMARY
